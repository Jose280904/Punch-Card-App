<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Time Clock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-layout">
    <section class="left-panel">
      <h1>Employee Time Clock</h1>

      <section id="authBox" class="card">
        <h2>Login</h2>
        <p class="muted">Create an account once, then log in normally after.</p>

        <input id="name" type="text" placeholder="Full Name - only for new account" />
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />

        <button id="loginBtn">Login</button>
        <button id="signupBtn" class="secondary">Create Account</button>
      </section>

      <section id="clockBox" class="card hidden">
        <h2 id="welcomeText">Welcome</h2>
        <p class="muted">Have a great day!</p>

        <button id="clockInBtn">⏱ Clock In</button>
        <button id="clockOutBtn">⏱ Clock Out</button>

        <div class="settings-box">
          <h3>Account Settings</h3>
          <input id="settingsName" type="text" placeholder="Update your full name" />
          <button id="saveNameBtn" class="secondary">Save Name</button>
          <button id="resetPasswordBtn" class="secondary">Send Password Reset Email</button>
        </div>

        <button id="logoutBtn" class="secondary">↪ Logout</button>
      </section>
    </section>

    <section id="adminBox" class="right-panel hidden">
      <h2>Admin Dashboard</h2>
      <p class="muted">View employee time clock records</p>

      <label for="weekPicker">Choose Week:</label>
      <input id="weekPicker" type="week" />

      <button id="loadRecordsBtn">Load Weekly Records</button>

      <div id="records"></div>

      <p class="footer-note">All times are local.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
