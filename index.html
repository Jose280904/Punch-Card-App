<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Time Clock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button id="settingsIconBtn" class="settings-icon hidden" title="Account Settings">👤</button>

  <header class="site-header">
    <img src="images/pcps-logo.png" alt="Pacific Critical Power Systems Logo" class="logo" />
  </header>

  <main class="app-layout">
    <section class="left-panel">
      <section id="authBox" class="card">
        <h2>Login</h2>
        <p class="muted">Enter your email and password.</p>

        <input id="email" type="email" placeholder="Email" />

        <div class="password-row">
          <input id="password" type="password" placeholder="Password" />
          <button id="showPasswordBtn" type="button" class="show-btn">Show</button>
        </div>

        <button id="loginBtn">Login</button>
        <button id="openSignupBtn" class="outline-btn">Create Account</button>
        <p id="forgotPasswordLink" class="forgot-password">Forgot password?</p>
      </section>

      <section id="signupBox" class="card hidden">
        <h2>Create Account</h2>
        <p class="muted">New users need to enter their name once.</p>

        <input id="signupName" type="text" placeholder="Full Name" />
        <input id="signupEmail" type="email" placeholder="Email" />

        <div class="password-row">
          <input id="signupPassword" type="password" placeholder="Password" />
          <button id="showSignupPasswordBtn" type="button" class="show-btn">Show</button>
        </div>

        <div class="password-row">
          <input id="confirmPassword" type="password" placeholder="Confirm Password" />
          <button id="showConfirmPasswordBtn" type="button" class="show-btn">Show</button>
        </div>

        <button id="signupBtn">Create Account</button>
        <button id="backToLoginBtn" class="outline-btn">Back to Login</button>
      </section>

      <section id="clockBox" class="card hidden">
        <h2 id="welcomeText">Welcome</h2>
        <p class="muted">Have a great day!</p>

        <div class="clock-actions">
          <button id="clockInBtn">⏱ Clock In</button>
          <button id="clockOutBtn">⏱ Clock Out</button>
        </div>

        <button id="logoutBtn" class="outline-btn">↪ Logout</button>
      </section>
    </section>

    <section id="adminBox" class="right-panel hidden">
      <h2>Admin Dashboard</h2>
      <p class="muted">View employee time clock records</p>

      <label for="weekPicker">Choose Week:</label>
      <input id="weekPicker" type="week" />

      <button id="loadRecordsBtn">Load Weekly Records</button>

      <div id="records">
        <p class="info-box">No records loaded yet.</p>
      </div>

      <p class="footer-note">All times are local.</p>
    </section>
  </main>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <button id="closeSettingsBtn" class="close-btn">×</button>

      <h2>Account Settings</h2>
      <p class="muted">Update your name or reset your password.</p>

      <input id="settingsName" type="text" placeholder="Update your full name" />

      <button id="saveNameBtn">Save Name</button>
      <button id="resetPasswordBtn" class="outline-btn">Send Password Reset Email</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
